
services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: giftflow-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: giftflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:6.0
    command: ["mongod", "--quiet"]
    container_name: giftflow-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  go-mod-cache:
  go-build-cache:
