
services:
 
  # 开发模式：热重载（无需重建镜像）
  backend-dev:
    image: public.ecr.aws/docker/library/golang:1.26-alpine
    container_name: giftflow-backend-dev
    working_dir: /app
    command: >
      sh -lc "
      apk add --no-cache git ca-certificates &&
      export PATH=/usr/local/go/bin:/go/bin:$PATH &&
      /usr/local/go/bin/go env -w GOPROXY=https://proxy.golang.org,direct &&
      /usr/local/go/bin/go install github.com/air-verse/air@latest &&
      /go/bin/air
      "
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
    # 可选：只在 dev 配置文件/配置文件 profile 下启用
    

  frontend:
    build: ./frontend
    container_name: giftflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-dev

  mongo:
    image: mongo:6.0
    command: ["mongod", "--quiet"]
    container_name: giftflow-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  go-mod-cache:
  go-build-cache:
